name = "balanced"
description = "Discord için TLS split + çoklu fake desync"
hostlist = "/usr/share/turkdpi/discord-hosts.txt"
tcp_args = ["--filter-tcp=80,443", "--dpi-desync=fake,multisplit", "--dpi-desync-split-pos=1,midsld", "--dpi-desync-repeats=5"]
udp_args = ["--filter-udp=443,50000-65535", "--dpi-desync=fake", "--dpi-desync-repeats=5"]
