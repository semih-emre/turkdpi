name = "aggressive"
description = "Discord için agresif fake + multisplit desync"
hostlist = "/usr/share/turkdpi/discord-hosts.txt"
tcp_args = ["--filter-tcp=80,443", "--dpi-desync=fake,multisplit", "--dpi-desync-split-pos=1,midsld", "--dpi-desync-repeats=8", "--dpi-desync-fooling=md5sig,badsum"]
udp_args = ["--filter-udp=443,50000-65535", "--dpi-desync=fake", "--dpi-desync-repeats=8", "--dpi-desync-fooling=badsum"]
