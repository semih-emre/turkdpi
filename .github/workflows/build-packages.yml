name: Derleme ve paketleme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platformdan bağımsız denetimler. Üç platformun paket işleri uzun sürdüğü
  # için hatalar önce burada yakalanıyor.
  test:
    name: Testler ve denetimler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Dağıtımın apt ile gelen Rust'ı projenin gerektirdiği sürümün gerisinde
      # kalıyor; toolchain rustup üzerinden kuruluyor.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, x86_64-apple-darwin

      - name: Biçim
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testler
        run: cargo test

      # Motor kurulu olduğunda entegrasyon testleri gerçekten çalışsın:
      # proxy yolunun uçtan uca kurulduğunu yalnızca bunlar doğruluyor.
      - name: Motoru kur ve entegrasyon testlerini çalıştır
        run: |
          mkdir -p "${PWD}/target/engine"
          TURKDPI_ENGINE_DIR="${PWD}/target/engine" cargo run -- install-engine
          TURKDPI_ENGINE_DIR="${PWD}/target/engine" cargo test --test engine_integration

      - name: Windows ve macOS derlemesi bozulmadı mı?
        run: |
          cargo check --target x86_64-pc-windows-gnu --all-targets
          cargo check --target x86_64-apple-darwin --all-targets

      - name: Kabuk betikleri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck scripts/*.sh scripts/90-turkdpi scripts/turkdpi-sleep

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Qt kur
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtdeclarative'
          cache: true

      - name: Servisi derle
        run: cargo build --release

      - name: Arayüzü derle
        run: |
          cmake -S gui -B build/gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gui --config Release

      - name: Paketi topla
        shell: pwsh
        run: |
          $out = "build/package/TurkDPI"
          New-Item -ItemType Directory -Force "$out/engine" | Out-Null
          Copy-Item target/release/turkdpi-service.exe $out
          Copy-Item build/gui/Release/turkdpi-gui.exe $out
          Copy-Item engine/manifest.json "$out/engine-manifest.json"
          Copy-Item profiles/*.txt $out
          Copy-Item version.json,README.md,LICENSE $out
          # Qt çalışma zamanını yanına kopyala; aksi halde kurulu Qt olmayan
          # makinede açılmıyor.
          windeployqt --qmldir gui --release "$out/turkdpi-gui.exe"

      - name: Motoru indir ve doğrula
        shell: pwsh
        env:
          TURKDPI_ENGINE_DIR: ${{ github.workspace }}/build/package/TurkDPI/engine
        run: ./target/release/turkdpi-service.exe install-engine

      - name: Paketi doğrula
        shell: pwsh
        env:
          TURKDPI_ENGINE_DIR: ${{ github.workspace }}/build/package/TurkDPI/engine
        run: |
          $service = "build/package/TurkDPI/turkdpi-service.exe"
          & $service info
          if ($LASTEXITCODE -ne 0) { throw "info komutu başarısız" }
          # Motorun gerçekten paketlendiğini doğrula.
          if (-not (Test-Path "build/package/TurkDPI/engine/ciadpi.exe")) {
            throw "motor pakete girmemiş"
          }

      - name: Arşivle
        shell: pwsh
        run: Compress-Archive -Path build/package/TurkDPI -DestinationPath turkdpi-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: turkdpi-windows-x64
          path: turkdpi-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Qt kur
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtdeclarative'
          cache: true

      - name: Servisi derle
        run: cargo build --release

      - name: Arayüzü derle
        run: |
          cmake -S gui -B build/gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gui

      # ByeDPI macOS için hazır ikili yayınlamıyor; kaynaktan derleyip
      # pakete koyuyoruz.
      - name: Motoru kaynaktan derle
        run: |
          git clone --depth 1 --branch v0.17.3 https://github.com/hufrea/byedpi.git build/byedpi
          make -C build/byedpi
          test -f build/byedpi/ciadpi

      - name: Paketi topla
        run: |
          out=build/package/TurkDPI
          mkdir -p "${out}/engine"
          cp target/release/turkdpi-service "${out}/"
          cp -R build/gui/turkdpi-gui.app "${out}/" 2>/dev/null || cp build/gui/turkdpi-gui "${out}/"
          cp build/byedpi/ciadpi "${out}/engine/"
          chmod +x "${out}/engine/ciadpi"
          cp engine/manifest.json "${out}/engine-manifest.json"
          cp profiles/*.txt version.json README.md LICENSE "${out}/"

      - name: Paketi doğrula
        env:
          TURKDPI_ENGINE_DIR: ${{ github.workspace }}/build/package/TurkDPI/engine
        run: |
          build/package/TurkDPI/turkdpi-service info
          test -x build/package/TurkDPI/engine/ciadpi

      - name: Arşivle
        run: cd build/package && zip -r ../../turkdpi-macos-arm64.zip TurkDPI

      - uses: actions/upload-artifact@v4
        with:
          name: turkdpi-macos-arm64
          path: turkdpi-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.architecture }} (.deb)
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Derleme bağımlılıklarını kur
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 8m \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 8m \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o DPkg::Lock::Timeout=60 install --yes --no-install-recommends \
            build-essential cmake git ninja-build pkg-config \
            libcap-dev libmnl-dev libnetfilter-queue-dev libnfnetlink-dev zlib1g-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window

      - name: systemd birimini doğrula
        run: |
          cargo build
          sudo ln -sf "${PWD}/target/debug/turkdpi-service" /usr/bin/turkdpi-service
          systemd-analyze verify systemd/turkdpi.service

      - name: Debian paketini oluştur
        run: ./scripts/build-deb.sh

      - name: Paketi doğrula
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[,]?[[:space:]]*$/\1/p' version.json)
          package="build/deb/turkdpi_${version}_${{ matrix.architecture }}.deb"
          test -f "${package}"
          test "$(dpkg-deb -f "${package}" Architecture)" = "${{ matrix.architecture }}"

          rm -rf build/package-check
          dpkg-deb -x "${package}" build/package-check
          for binary in usr/bin/turkdpi-service usr/bin/turkdpi-gui usr/lib/turkdpi/nfqws; do
            file "build/package-check/${binary}"
          done
          # Motor bildirimi olmadan `install-engine` çalışmıyor.
          test -f build/package-check/usr/share/turkdpi/engine-manifest.json

          case "${{ matrix.architecture }}" in
            amd64) expected='x86-64' ;;
            arm64) expected='ARM aarch64' ;;
          esac
          for binary in usr/bin/turkdpi-service usr/bin/turkdpi-gui usr/lib/turkdpi/nfqws; do
            file "build/package-check/${binary}" | grep -F "${expected}"
          done

          # Arayüz açılıp ayakta kalıyor mu? 124, timeout'un süreci kesmesi
          # demek; yani çökmeden çalışmış.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5s build/package-check/usr/bin/turkdpi-gui
          gui_status=$?
          set -e
          test "${gui_status}" -eq 124

      - uses: actions/upload-artifact@v4
        with:
          name: turkdpi-${{ matrix.architecture }}
          path: build/deb/turkdpi_*_${{ matrix.architecture }}.deb
          if-no-files-found: error
          retention-days: 30

  cachyos:
    name: CachyOS x86_64
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Arch derleme bağımlılıklarını kur
        run: |
          pacman -Syu --noconfirm --needed \
            cmake git ninja rust qt6-base qt6-declarative \
            libmnl libnetfilter_queue libnfnetlink zlib

      - name: CachyOS paketini oluştur
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[,]?[[:space:]]*$/\1/p' version.json)
          build_root=/tmp/turkdpi-cachyos-build
          rm -rf "${build_root}"
          mkdir -p "${build_root}"
          tar --exclude='./.git' --exclude='./target' --exclude='./build' \
            --exclude='./*.pkg.tar.zst' \
            --transform="s,^\./,turkdpi-${version}/," \
            -czf "${build_root}/turkdpi-${version}.tar.gz" .
          cp PKGBUILD "${build_root}/PKGBUILD"

          useradd --create-home builder
          chown -R builder:builder "${build_root}"
          runuser -u builder -- bash -lc \
            "cd '${build_root}' && makepkg --noconfirm --nodeps --cleanbuild --force"
          cp "${build_root}"/turkdpi-*-x86_64.pkg.tar.zst .

      - name: CachyOS paketini doğrula
        shell: bash
        run: |
          package=$(find . -maxdepth 1 -type f -name 'turkdpi-*-x86_64.pkg.tar.zst' -print -quit)
          test -n "${package}"
          pacman -Qp "${package}"

          rm -rf /tmp/turkdpi-package-check
          mkdir -p /tmp/turkdpi-package-check
          bsdtar -xf "${package}" -C /tmp/turkdpi-package-check
          file /tmp/turkdpi-package-check/usr/bin/turkdpi-service | grep -F 'x86-64'
          file /tmp/turkdpi-package-check/usr/bin/turkdpi-gui | grep -F 'x86-64'
          file /tmp/turkdpi-package-check/usr/lib/turkdpi/nfqws | grep -F 'x86-64'

          set +e
          QT_QPA_PLATFORM=offscreen timeout 5s \
            /tmp/turkdpi-package-check/usr/bin/turkdpi-gui
          gui_status=$?
          set -e
          test "${gui_status}" -eq 124

      - uses: actions/upload-artifact@v4
        with:
          name: turkdpi-cachyos-x86_64
          path: turkdpi-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
